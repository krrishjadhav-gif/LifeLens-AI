# ===================================================================
# LifeLens AI - Application Configuration
# ===================================================================

server.port=8080
spring.application.name=lifelens-ai

# Database Configuration
# Default: H2 in-memory database for immediate out-of-the-box local testing.
# Production / MySQL / Aiven: Set DB_URL, DB_USERNAME, DB_PASSWORD, DB_DRIVER in environment.
spring.datasource.url=${DB_URL:jdbc:h2:mem:lifelensdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Web Console (accessible at /h2-console during local testing)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
